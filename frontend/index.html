<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- The page background, --bg in styles.css, for the phone's toolbar. -->
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)" />
    <!-- Inline, so there is no file to serve. Without a link the browser would
         ask for /favicon.ico, which nginx answers with a 404 rather than the
         SPA page. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 18 18'%3E%3Crect width='18' height='18' rx='3' fill='%231f6feb'/%3E%3Cpath d='M6.5 1.5v15M11.5 1.5v15M1.5 6.5h15M1.5 11.5h15' stroke='%23fff' stroke-width='1.2'/%3E%3C/svg%3E"
    />
    <title>Sudoku Solver · OR-Tools CP-SAT</title>
    <meta
      name="description"
      content="Solve Sudoku puzzles with Google OR-Tools CP-SAT constraint programming."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
