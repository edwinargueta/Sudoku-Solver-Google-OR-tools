name: ci

# Tests run on every push to main and on every pull request. Images are only
# built once every suite has passed — a red test never reaches the registry.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  backend:
    name: backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check app tests

      - name: Test
        run: python -m pytest

  frontend:
    name: frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      # The same version `nvm use` picks locally, so CI and laptops agree.
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck && npm run typecheck:e2e

      - name: Test
        run: npm test

  e2e:
    name: browser tests
    # Pinned rather than ubuntu-latest: fonts and the system libraries WebKit
    # needs come with the runner image, so moving to a new Ubuntu release
    # should be a deliberate change, made alongside a Playwright upgrade.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      # Runtime dependencies only, as the image installs them, into the .venv
      # that playwright.config.ts starts uvicorn from. A module that only the
      # dev extras provide fails here rather than in the pod.
      - name: Install the API
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install .

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # Not cached: restoring them takes about as long as downloading them,
      # and the system libraries WebKit needs cannot be cached at all.
      - name: Install browsers
        run: npx playwright install --with-deps --only-shell chromium webkit

      # playwright.config.ts builds the bundle and starts the API and preview.
      - name: Test
        run: npx playwright test

      # A trace and a screenshot for anything that failed, inside the report.
      # Download it and run `npx playwright show-report playwright-report.zip`.
      # Overwritten, so re-running a failed job keeps the latest attempt's.
      - name: Upload report
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
          overwrite: true

      # A run cut off by the timeout never writes its report, but the traces
      # of the tests that did finish are already on disk.
      - name: Upload traces
        if: cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: frontend/test-results/
          retention-days: 14
          overwrite: true

  build:
    name: build and push
    runs-on: ubuntu-latest
    # The gate: nothing is built or pushed unless every suite is green.
    needs: [backend, frontend, e2e]
    # Pull requests are tested, not published.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write            # required to push to GHCR

    strategy:
      matrix:
        # One entry per image. Each `name` becomes
        # ghcr.io/<owner>/<name>, which must match the image: line in
        # deploy/k8s/overlays/prod — a mismatch shows up as ImagePullBackOff.
        include:
          - name: sudoku-backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - name: sudoku-frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile

    steps:
      - uses: actions/checkout@v7

      # The runner is x86; the Ampere VM is not. QEMU covers the difference.
      # The frontend's Node stage is pinned to $BUILDPLATFORM in its
      # Dockerfile, so only the small nginx stage is actually emulated.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR rejects an uppercase owner, and GitHub usernames may have one.
      - name: Compute lowercase owner
        id: owner
        run: echo "lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push (arm64)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          # :latest is what the cluster pulls; the commit tag is there so a
          # bad deploy can be pinned back to a known-good image.
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.lc }}/${{ matrix.name }}:latest
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.lc }}/${{ matrix.name }}:${{ github.sha }}
          # A single-platform image needs no attestation manifest; without
          # this the package page grows an "unknown/unknown" entry.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
