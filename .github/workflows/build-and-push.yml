name: build-and-push

# Every push to main, and on demand from the Actions tab. Documentation and
# manifest changes do not change the images, so they do not trigger a build.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'deploy/**'
      - '.gitignore'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write            # required to push to GHCR

    strategy:
      matrix:
        # One entry per image. Each `name` becomes
        # ghcr.io/<owner>/<name>, which must match the image: line in
        # deploy/k8s/overlays/prod — a mismatch shows up as ImagePullBackOff.
        include:
          - name: sudoku-backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - name: sudoku-frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The runner is x86; the Ampere VM is not. QEMU covers the difference.
      # The frontend's Node stage is pinned to $BUILDPLATFORM in its
      # Dockerfile, so only the small nginx stage is actually emulated.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR rejects an uppercase owner, and GitHub usernames may have one.
      - name: Compute lowercase owner
        id: owner
        run: echo "lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push (arm64)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          # :latest is what the cluster pulls; the commit tag is there so a
          # bad deploy can be pinned back to a known-good image.
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.lc }}/${{ matrix.name }}:latest
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.lc }}/${{ matrix.name }}:${{ github.sha }}
          # A single-platform image needs no attestation manifest; without
          # this the package page grows an "unknown/unknown" entry.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
