# Applied once per cluster, after cert-manager itself:
#
#   kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/<VERSION>/cert-manager.yaml
#   kubectl apply -f deploy/k8s/bootstrap/clusterissuer.yaml
#
# It lives outside the overlays on purpose: it is cluster-scoped, and its
# kind does not exist until cert-manager's CRDs are installed.
#
# Swap the server for the staging URL while testing — Let's Encrypt rate
# limits are per-domain and unforgiving:
#   https://acme-staging-v02.api.letsencrypt.org/directory
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: edwin.argueta.a93@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            class: traefik
