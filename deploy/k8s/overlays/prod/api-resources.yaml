# The VM's cores are shared with k3s, Traefik and cert-manager, so requesting
# a whole one could leave the pod Pending. The limit is one CPU: the one
# search worker in the base config uses no more, and a long solve is held
# to it rather than starving the node.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  template:
    spec:
      containers:
        - name: api
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 640Mi
