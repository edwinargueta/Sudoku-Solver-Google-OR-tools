# The real hostname and the certificate that goes with it. cert-manager
# sees the annotation, solves the HTTP-01 challenge over port 80, and fills
# in the secret named below.
#
# The host below has to resolve to the VM before the first apply, or the
# challenge has nowhere to land. It appears twice on purpose: once for the
# certificate, once for the routing rule. Change both together.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sudoku
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - sudoku-csp.duckdns.org
      secretName: sudoku-tls
  rules:
    - host: sudoku-csp.duckdns.org
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
