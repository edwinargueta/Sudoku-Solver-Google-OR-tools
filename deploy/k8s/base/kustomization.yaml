apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - backend.yaml
  - frontend.yaml
  - ingress.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: sudoku-solver
    includeSelectors: false

# Generated, so the name carries a content hash: change a value here and the
# api pods roll on the next apply instead of silently keeping the old config.
configMapGenerator:
  - name: api-config
    literals:
      - SUDOKU_SOLVER_TIME_LIMIT_S=10.0
      # One search worker. On a 9x9 grid CP-SAT's parallel portfolio only
      # adds start-up and contention, and one thread is what the pod's
      # one-CPU limit can run anyway.
      - SUDOKU_SOLVER_WORKERS=1
      # Solves at once before a 503. The default counts the node's CPUs,
      # which the pod's limit does not change; two share its one CPU.
      - SUDOKU_SOLVER_CONCURRENCY=2
      # Read by uvicorn: whose X-Forwarded-For and -Proto it believes. This
      # is k3s's default pod network, where Traefik and the web pods run. A
      # client outside the cluster only gets here through Traefik, which
      # replaces those headers with what it saw itself; nothing is trusted
      # from anywhere else. Change it with the cluster's --cluster-cidr.
      - FORWARDED_ALLOW_IPS=10.42.0.0/16

images:
  - name: sudoku-api
    newTag: dev
  - name: sudoku-web
    newTag: dev
